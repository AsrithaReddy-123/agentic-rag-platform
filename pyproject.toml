[project]
name = "agentic-rag-platform"
version = "0.1.0"
description = "Agentic RAG knowledge platform with hybrid retrieval, guardrails, and reproducible evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.3",
  "langgraph>=0.2.50",
  "langchain-core>=0.3",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "mlflow>=2.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
eval = ["ragas>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
